name: vyapaarsaathi
description: "Zero-touch financial assistant for informal workers - iQOO Hackathon 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1

  # Local storage / offline-first cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0

  # Camera + AI capture
  camera: ^0.12.0+2
  permission_handler: ^11.3.1

  # Audio (voice commands, passive audio logging)
  record: ^7.1.1
  audioplayers: ^6.1.0

  # PDF preview (GST invoice)
  syncfusion_flutter_pdfviewer: ^34.2.6

  # Charts (credit score gauge base, cash flow)
  fl_chart: ^1.2.0

  # Routing
  go_router: ^18.0.0

  # Gamification
  confetti: ^0.8.0
  lottie: ^3.1.2
  vibration: ^3.2.1

  # Sharing (WhatsApp milestone share)
  share_plus: ^13.3.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Office Kit SDK (iQOO Hackathon 2026 — provided by organizers).
  office_kit_sdk:
    path: ../office_kit_sdk

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: 6.3.2
  syncfusion_flutter_pdf: 34.2.6
  sherpa_onnx: 1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/lottie/
    - assets/models/
    - assets/asr/dolphin/model.int8.onnx
    - assets/asr/dolphin/tokens.txt

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 700
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 700